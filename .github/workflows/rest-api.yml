name: Rest-API | Playwright Tests

on: [push, pull_request]

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  rest_api_playwright_test:
    runs-on: ${{ matrix.operating-systems }}

    strategy:
      fail-fast: false
      matrix:
        operating-systems: [ubuntu-latest]
        php-versions: ['8.3']
        node-version: ['22.13.1']
        shard-index: [1,2,3,4,5,6]
        shard-total: [6]

    name: Rest-API | Playwright Tests | Shard ${{ matrix.shard-index }} Of ${{ matrix.shard-total }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bagisto
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      # Step 1: Checkout current repository (for workflow & tests)
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      # Step 3: Setup Node.js
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Step 4: Create Bagisto project (fresh clone)
      - name: Create Bagisto Project
        run: composer create-project bagisto/bagisto bagisto-project

      # Step 5: Go inside Bagisto directory
      - name: Move into project folder
        working-directory: bagisto-project
        run: |
          echo "Current directory: $(pwd)"
          ls -la

      # Step 6: Configure .env for MySQL + APP_URL + Sanctum
      - name: Configure Environment File
        working-directory: bagisto-project
        run: |
          cp .env.example .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.mysql.ports['3306'] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(APP_DEBUG=\s*\).*$|\1false|" .env
          sed -i "s|^\(APP_URL=\s*\).*$|\1http://127.0.0.1:8000|" .env
          echo "SANCTUM_STATEFUL_DOMAINS=http://127.0.0.1:8000/public" >> .env
          cat .env

      # Step 7: Install Composer Dependencies (for Bagisto)
      - name: Install Composer Dependencies
        working-directory: bagisto-project
        run: composer install

      # Step 8: Install Bagisto (skip optional stuff)
      - name: Run Bagisto Installer
        working-directory: bagisto-project
        run: php artisan bagisto:install --skip-env-check --skip-admin-creation --skip-github-star

      # Step 9: Seed product table
      - name: Seed Product Table
        working-directory: bagisto-project
        run: php artisan db:seed --class="Webkul\\Installer\\Database\\Seeders\\ProductTableSeeder"

      # Step 10: Install Bagisto REST API Package
      - name: Install Bagisto REST API
        working-directory: bagisto-project
        run: |
          composer require bagisto/rest-api
          php artisan bagisto-rest-api:install

      # Step 11: Setup Playwright dependencies in REST API folder
      - name: Install Node.js Dependencies
        working-directory: bagisto-project/vendor/bagisto/rest-api
        run: npm install

      - name: Install Playwright Browsers
        working-directory: bagisto-project/vendor/bagisto/rest-api
        run: |
          sudo apt-get update --allow-releaseinfo-change
          npx playwright install --with-deps chromium

      # Step 12: Start Laravel server
      - name: Start Laravel server
        working-directory: bagisto-project
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 > server.log 2>&1 &
          echo "Waiting for Laravel server to start..."
          timeout 40 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done'
          echo "Laravel started successfully!"

      # Step 13: Run Playwright Tests (all)
      - name: Run All Playwright Tests
        working-directory: bagisto-project/vendor/bagisto/rest-api
        env:
          BASE_URL: 'http://127.0.0.1:8000'
        run: |
          npx playwright test --config=tests/api-pw/playwright.config.ts --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}

      # Step 14: Upload Playwright Results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard-index }}-${{ github.run_id }}-${{ github.run_number }}
          path: |
            bagisto-project/vendor/bagisto/rest-api/tests/api-pw/playwright-report
            bagisto-project/vendor/bagisto/rest-api/tests/api-pw/test-results
          retention-days: 2
